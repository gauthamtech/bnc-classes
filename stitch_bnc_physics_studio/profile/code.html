</div>
<div class="flex flex-col gap-unit-xs">

<input class="bg-recessed-night border border-hairline text-on-background font-body-lg text-body-lg rounded h-touch-target px-unit-md focus:outline-none focus:border-primary focus:ring-0 transition-colors" id="phone" type="tel" value="+91 98765 43210"/>
</div>

<button class="bg-primary text-on-primary font-label-md text-label-md rounded h-touch-target px-unit-lg flex-1 md:flex-none flex items-center justify-center hover:bg-primary-fixed transition-colors active:scale-95 duration-200" type="submit">
